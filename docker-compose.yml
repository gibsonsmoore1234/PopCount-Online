# Local PostgreSQL for running the app against a real database server:
#   docker compose up -d
#   DATABASE_URL=postgres://pc:pc@localhost:5432/popularity npm run dev
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pc
      POSTGRES_PASSWORD: pc
      POSTGRES_DB: popularity
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pc -d popularity"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
