name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pc
          POSTGRES_PASSWORD: pc
          POSTGRES_DB: popularity
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pc -d popularity"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - name: Migrate & seed a real Postgres
        env:
          DATABASE_URL: postgres://pc:pc@localhost:5432/popularity
        run: npm run db:migrate && npm run db:seed
      - run: npm run build
        env:
          DATABASE_URL: postgres://pc:pc@localhost:5432/popularity
